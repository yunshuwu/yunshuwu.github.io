<li class="content-entry">
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3>
  <p class="entry-meta">Published <time datetime="{{ include.post.date | date: '%Y-%m-%d' }}">{{ include.post.date | date: '%B %-d, %Y' }}</time></p>
  {% if include.post.description %}<p>{{ include.post.description | escape }}</p>{% endif %}
  {% include tags.html tags=include.post.tags %}
</li>
